<!DOCTYPE html>
<!-- Saif Alshamali - 410002147 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recycling Items - Reloop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f0f7f0; }
        .navbar { background-color: #2e7d32; }
        .page-header { background-color: #2e7d32; color: white; padding: 20px 0; margin-bottom: 30px; }
        .btn-primary { background-color: #2e7d32; border-color: #2e7d32; }
        .btn-primary:hover { background-color: #1b5e20; border-color: #1b5e20; }
        .table thead { background-color: #2e7d32; color: white; }
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">♻ Reloop</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="index.html">Home</a>
            <a class="nav-link text-white" href="locations.html">Locations</a>
            <a class="nav-link text-white" href="users.html">Users</a>
            <a class="nav-link text-white active" href="items.html">Items</a>
            <a class="nav-link text-white" href="logs.html">Logs</a>
        </div>
    </div>
</nav>
<div class="page-header text-center">
    <h2>♻ Recycling Items</h2>
    <p class="mb-0">Manage recyclable items and their guidelines</p>
</div>
<div id="toast-container">
    <div id="toast" class="toast align-items-center text-white border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toast-message"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>
<div class="container">
    <div class="row mb-3 align-items-center">
        <div class="col-md-5">
            <div class="input-group">
                <input type="text" id="searchInput" class="form-control" placeholder="Search by item name...">
                <button class="btn btn-outline-success" onclick="searchItems()">Search</button>
                <button class="btn btn-outline-secondary" onclick="loadItems()">Reset</button>
            </div>
        </div>
        <div class="col-md-7 text-end">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#itemModal" onclick="openAddModal()">+ Add New Item</button>
        </div>
    </div>
    <div id="loading" class="text-center my-4">
        <div class="spinner-border text-success" role="status"></div>
        <p class="mt-2 text-muted">Loading items...</p>
    </div>
    <div class="table-responsive" id="tableContainer" style="display:none;">
        <table class="table table-hover table-bordered shadow-sm bg-white">
            <thead>
            <tr><th>ID</th><th>Item Name</th><th>Category</th><th>Recyclable</th><th>Preparation</th><th>Common Mistakes</th><th>Notes</th><th>Actions</th></tr>
            </thead>
            <tbody id="itemsTableBody"></tbody>
        </table>
    </div>
    <div id="noResults" class="alert alert-warning text-center" style="display:none;">No items found.</div>
</div>

<div class="modal fade" id="itemModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header" style="background-color:#2e7d32;color:white;">
                <h5 class="modal-title" id="modalTitle">Add Item</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="itemId">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Item Name *</label>
                        <input type="text" id="itemName" class="form-control" placeholder="e.g. Plastic Bottle">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Category *</label>
                        <input type="text" id="category" class="form-control" placeholder="e.g. Plastic">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">Recyclable</label>
                        <select id="isRecyclable" class="form-select">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-bold">Preparation Steps</label>
                        <input type="text" id="preparationSteps" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Common Mistakes</label>
                        <input type="text" id="commonMistakes" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Notes</label>
                        <input type="text" id="notes" class="form-control">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveItem()">Save Item</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Confirm Delete</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">Are you sure you want to delete <strong id="deleteItemName"></strong>?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var API = '/api/items';
    var allItems = [];
    var deleteId = null;

    function loadItems() {
        document.getElementById('searchInput').value = '';
        showLoading(true);
        fetch(API)
            .then(function(r) { return r.json(); })
            .then(function(data) { allItems = data; renderTable(data); })
            .catch(function() { showToast('Error loading items.', 'danger'); });
    }

    function renderTable(items) {
        showLoading(false);
        if (items.length === 0) { document.getElementById('noResults').style.display = 'block'; return; }
        document.getElementById('tableContainer').style.display = 'block';
        var rows = '';
        items.forEach(function(item) {
            rows += '<tr>' +
                '<td>' + item.id + '</td>' +
                '<td>' + item.itemName + '</td>' +
                '<td>' + item.category + '</td>' +
                '<td><span class="badge ' + (item.recyclable ? 'bg-success' : 'bg-secondary') + '">' + (item.recyclable ? 'Yes' : 'No') + '</span></td>' +
                '<td>' + (item.preparationSteps || '-') + '</td>' +
                '<td>' + (item.commonMistakes || '-') + '</td>' +
                '<td>' + (item.notes || '-') + '</td>' +
                '<td>' +
                '<button class="btn btn-sm btn-warning me-1" onclick="openEditModal(' + item.id + ')">Edit</button>' +
                '<button class="btn btn-sm btn-danger" onclick="openDeleteModal(' + item.id + ', \'' + item.itemName + '\')">Delete</button>' +
                '</td></tr>';
        });
        document.getElementById('itemsTableBody').innerHTML = rows;
    }

    function findById(id) {
        var found = null;
        allItems.forEach(function(item) { if (item.id === id) { found = item; } });
        return found;
    }

    function showLoading(show) {
        document.getElementById('loading').style.display = show ? 'block' : 'none';
        document.getElementById('tableContainer').style.display = 'none';
        document.getElementById('noResults').style.display = 'none';
    }

    function searchItems() {
        var name = document.getElementById('searchInput').value;
        if (!name) { loadItems(); return; }
        showLoading(true);
        fetch(API + '/search?name=' + name)
            .then(function(r) { return r.json(); })
            .then(function(data) { allItems = data; renderTable(data); })
            .catch(function() { showToast('Search failed.', 'danger'); });
    }

    function openAddModal() {
        document.getElementById('modalTitle').textContent = 'Add New Item';
        document.getElementById('itemId').value = '';
        document.getElementById('itemName').value = '';
        document.getElementById('category').value = '';
        document.getElementById('isRecyclable').value = 'true';
        document.getElementById('preparationSteps').value = '';
        document.getElementById('commonMistakes').value = '';
        document.getElementById('notes').value = '';
    }

    function openEditModal(id) {
        var item = findById(id);
        if (!item) { return; }
        document.getElementById('modalTitle').textContent = 'Edit Item';
        document.getElementById('itemId').value = item.id;
        document.getElementById('itemName').value = item.itemName;
        document.getElementById('category').value = item.category;
        document.getElementById('isRecyclable').value = item.recyclable ? 'true' : 'false';
        document.getElementById('preparationSteps').value = item.preparationSteps || '';
        document.getElementById('commonMistakes').value = item.commonMistakes || '';
        document.getElementById('notes').value = item.notes || '';
        new bootstrap.Modal(document.getElementById('itemModal')).show();
    }

    function saveItem() {
        var itemName = document.getElementById('itemName').value;
        var category = document.getElementById('category').value;
        if (!itemName || !category) { showToast('Item Name and Category are required.', 'warning'); return; }
        var id = document.getElementById('itemId').value;
        var payload = {
            itemName: itemName, category: category,
            recyclable: document.getElementById('isRecyclable').value === 'true',
            preparationSteps: document.getElementById('preparationSteps').value,
            commonMistakes: document.getElementById('commonMistakes').value,
            notes: document.getElementById('notes').value
        };
        fetch(id ? API + '/' + id : API, {
            method: id ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(function(r) {
            if (r.ok) {
                bootstrap.Modal.getInstance(document.getElementById('itemModal')).hide();
                loadItems();
                showToast(id ? 'Item updated!' : 'Item added!', 'success');
            } else { showToast('Failed to save.', 'danger'); }
        }).catch(function() { showToast('Error saving item.', 'danger'); });
    }

    function openDeleteModal(id, name) {
        deleteId = id;
        document.getElementById('deleteItemName').textContent = name;
        new bootstrap.Modal(document.getElementById('deleteModal')).show();
    }

    function confirmDelete() {
        fetch(API + '/' + deleteId, { method: 'DELETE' })
            .then(function(r) {
                if (r.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
                    loadItems();
                    showToast('Item deleted!', 'success');
                } else { showToast('Delete failed.', 'danger'); }
            }).catch(function() { showToast('Error deleting.', 'danger'); });
    }

    function showToast(msg, type) {
        var toast = document.getElementById('toast');
        toast.className = 'toast align-items-center text-white border-0 bg-' + type;
        document.getElementById('toast-message').textContent = msg;
        new bootstrap.Toast(toast, { delay: 3000 }).show();
    }

    document.getElementById('searchInput').addEventListener('keyup', function(e) {
        if (e.key === 'Enter') { searchItems(); }
    });

    loadItems();
</script>
</body>
</html>
